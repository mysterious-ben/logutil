repos:

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0  # updated to latest released version
    hooks:
      - id: ruff
        args: [--fix]
      # - id: ruff-format  # uncomment if you prefer Ruff formatting

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0  # updated to latest release
    hooks:
      - id: debug-statements
      - id: check-yaml
      - id: requirements-txt-fixer
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: python
        types: [python]
        pass_filenames: false

